<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Somon Cods TJ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; --card: #151515; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
        
        .header { background: #000; padding: 15px; border-bottom: 2px solid var(--neon); position: sticky; top: 0; z-index: 100; box-shadow: 0 0 15px var(--neon); }
        .stats-row { display: flex; justify-content: space-around; font-size: 14px; margin-top: 5px; color: #fff; }

        .page { display: none; padding: 20px; height: 75vh; overflow-y: auto; text-align: center; }
        .active { display: block; }

        /* Главная кнопка */
        #coin-space { margin-top: 30px; }
        #coin { width: 220px; height: 220px; background: radial-gradient(circle, var(--neon) 0%, #000 80%); border-radius: 50%; margin: 0 auto; border: 4px solid #fff; box-shadow: 0 0 30px var(--neon); display: flex; align-items: center; justify-content: center; font-size: 60px; cursor: pointer; transition: transform 0.05s; }
        #coin:active { transform: scale(0.92); }

        /* Карточки */
        .card { background: var(--card); border: 1px solid #333; padding: 15px; margin: 12px 0; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .card-info b { color: #fff; font-size: 16px; }
        .card-info small { color: var(--neon); opacity: 0.8; }
        
        button.buy-btn { background: var(--neon); color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; font-family: inherit; }
        button:disabled { background: #333; color: #666; }

        /* Навигация */
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #000; border-top: 1px solid var(--neon); padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; padding: 15px; text-align: center; font-size: 12px; color: #555; cursor: pointer; transition: 0.3s; }
        .nav-item.active-nav { color: var(--neon); text-shadow: 0 0 10px var(--neon); font-weight: bold; }

        /* Реферальная секция */
        .ref-box { background: #111; padding: 10px; border-radius: 8px; margin-top: 10px; display: flex; gap: 5px; }
        #reflink { background: none; border: none; color: #888; width: 100%; font-size: 12px; }

        .sync-btn { background: none; border: 1px solid var(--neon); color: var(--neon); padding: 10px; width: 100%; margin-top: 20px; border-radius: 8px; }
    </style>
</head>
<body onload="initApp()">

    <div class="header">
        <div style="font-size: 24px; font-weight: bold;">💰 <span id="balance">0</span></div>
        <div class="stats-row">
            <span>⚡ <span id="pps">0</span>/час</span>
            <span>LVL: <span id="lvl-num">1</span></span>
        </div>
    </div>

    <div id="tap-page" class="page active">
        <div id="coin-space">
            <div id="coin">💻</div>
        </div>
        <p style="margin-top: 25px; color: #888;">СИСТЕМА: <span id="lvl-name">Cyber Novice</span></p>
        <button class="sync-btn" onclick="sendSync()">💾 СОХРАНИТЬ ПРОГРЕСС</button>
    </div>

    <div id="mine-page" class="page">
        <h2 style="color: #fff;">UPGRADES</h2>
        <div class="card">
            <div class="card-info"><b>Video Card RTX</b><br><small>+500 $SOM/час</small></div>
            <button class="buy-btn" onclick="buyUpgrade(50000, 500)">50k</button>
        </div>
        <div class="card">
<div class="card-info"><b>Server ASIC</b><br><small>+5,000 $SOM/час</small></div>
            <button class="buy-btn" onclick="buyUpgrade(500000, 5000)">500k</button>
        </div>
        <div class="card">
            <div class="card-info"><b>Quantum CPU</b><br><small>+50,000 $SOM/час</small></div>
            <button class="buy-btn" onclick="buyUpgrade(5000000, 50000)">5M</button>
        </div>
    </div>

    <div id="earn-page" class="page">
        <h2 style="color: #fff;">MISSIONS</h2>
        
        <div class="card" onclick="watchAd()">
            <div class="card-info"><b>📺 Смотреть рекламу</b><br><small>Бонус за просмотр</small></div>
            <b id="ads-count">0/10</b>
        </div>

        <div style="margin-top: 30px; text-align: left;">
            <label>Твоя ссылка (Invite Friends):</label>
            <div class="ref-box">
                <input type="text" id="reflink" readonly value="Загрузка...">
                <button onclick="copyRef()" style="background: var(--neon); border:none; padding:5px 10px; border-radius:4px;">COPY</button>
            </div>
            <small style="color: #666;">+50,000 $SOM за друга</small>
        </div>

        <div style="margin-top: 40px; padding: 20px; border: 1px dashed var(--neon); border-radius: 15px;">
            <p id="w-status" style="color: #ff4444;">❌ ВЫВОД ЗАБЛОКИРОВАН</p>
            <small id="w-hint">Нужен 3 LVL + 3 Друга + 10 Реклам</small>
            <button id="withdraw-btn" disabled class="buy-btn" style="width: 100%; margin-top: 15px; height: 50px;" onclick="requestWithdraw()">ВЫВЕСТИ 5 TJS</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active-nav" onclick="showPage('tap-page', this)">🖥️ TAP</div>
        <div class="nav-item" onclick="showPage('mine-page', this)">⚡ MINE</div>
        <div class="nav-item" onclick="showPage('earn-page', this)">💰 EARN</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let balance = 0, pps = 0, ads = 0, clicksToSync = 0, pIncToSync = 0;
        let userLvl = 1;

        tg.expand();

        function initApp() {
            // Генерация реф-ссылки (замени USERNAME на свой!)
            let userId = tg.initDataUnsafe.user.id;
            document.getElementById('reflink').value = "https://t.me/ТВОЙ_БОТ_USERNAME?start=" + userId;

            // Запуск автодохода (раз в секунду)
            setInterval(() => {
                if (pps > 0) {
                    balance += (pps / 3600);
                    updateUI();
                }
            }, 1000);
        }

        function tap() {
            let perTap = 1000; // Монет за один клик
            balance += perTap;
            clicksToSync += perTap;
            updateUI();
            
            // Простая анимация клика
            document.getElementById('coin').style.transform = "scale(0.95)";
            setTimeout(() => document.getElementById('coin').style.transform = "scale(1)", 50);
        }
        document.getElementById('coin').onclick = tap;

        function buyUpgrade(cost, income) {
            if (balance >= cost) {
                balance -= cost;
                pps += income;
                pIncToSync += income;
                updateUI();
                tg.HapticFeedback.impactOccurred('medium');
            } else {
                tg.showAlert("Недостаточно $SOM!");
            }
        }

        function watchAd() {
            if (ads < 10) {
                ads++;
                balance += 10000;
                updateUI();
                tg.showScanQrPopup({ text: "Имитация просмотра рекламы..." });
                setTimeout(() => tg.closeScanQrPopup(), 2000);
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(balance).toLocaleString();
            document.getElementById('pps').innerText = pps;
            document.getElementById('ads-count').innerText = ads + "/10";

            // Уровни
            if (balance >= 5000000) { 
                userLvl = 3; 
                document.getElementById('lvl-name').innerText = "Cyber Runner"; 
            }
            else if (balance >= 1000000) { 
                userLvl = 2; 
                document.getElementById('lvl-name').innerText = "System Hacker"; 
            }
            else { 
                userLvl = 1; 
                document.getElementById('lvl-name').innerText = "Cyber Novice"; 
            }
            document.getElementById('lvl-num').innerText = userLvl;

            // Проверка вывода
            let btn = document.getElementById('withdraw-btn');
            if (userLvl >= 3 && ads >= 10) {
                btn.disabled = false;
                document.getElementById('w-status').innerText = "✅ ВЫВОД ДОСТУПЕН";
                document.getElementById('w-status').style.color = "#00ffcc"; // Исправлено: просто код цвета
            }
        }
           

        function showPage(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            document.getElementById(pageId).classList.add('active');
            el.classList.add('active-nav');
        }

        function copyRef() {
            let copyText = document.getElementById("reflink");
            copyText.select();
            document.execCommand("copy");
            tg.showScanQrPopup({ text: "Ссылка скопирована!" });
            setTimeout(() => tg.closeScanQrPopup(), 1000);
        }

        function sendSync() {
            // Формат: клики:реклама:доход_в_час
            let data = clicksToSync + ":" + ads + ":" + pIncToSync;
            tg.sendData(data);
            clicksToSync = 0;
            pIncToSync = 0;
        }

        function requestWithdraw() {
            tg.close(); // Закрываем приложение, чтобы юзер написал /withdraw боту
        }
    </script>
</body>
</html>
