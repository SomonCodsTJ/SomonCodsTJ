<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Somon Cods TJ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; }
        body { background: var(--bg); color: var(--neon); font-family: monospace; margin: 0; text-align: center; user-select: none; overflow: hidden; }
        
        .header { background: #000; padding: 15px; border-bottom: 2px solid var(--neon); box-shadow: 0 0 10px var(--neon); }
        .page { display: none; padding: 20px; height: 75vh; overflow-y: auto; position: relative; }
        .active { display: block; }

        /* Кнопка тапа */
        #coin-container { position: relative; margin: 50px auto; width: 220px; height: 220px; }
        #coin { width: 100%; height: 100%; background: radial-gradient(var(--neon), #000); border-radius: 50%; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 60px; cursor: pointer; transition: transform 0.05s; z-index: 2; position: relative; }
        #coin:active { transform: scale(0.95); }

        /* Анимация цифр */
        .tap-animation { position: absolute; color: #fff; font-size: 24px; font-weight: bold; pointer-events: none; animation: floatUp 0.6s ease-out forwards; z-index: 10; }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #000; border-top: 1px solid var(--neon); }
        .nav-item { flex: 1; padding: 15px; color: #444; font-size: 12px; }
        .active-nav { color: var(--neon); font-weight: bold; }
        
        .card { background: #111; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        button { background: var(--neon); color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body onload="init()">

<div class="header">
    <div style="font-size: 22px;">💰 <span id="bal">0</span></div>
    <div style="font-size: 12px; opacity: 0.7;">⚡ <span id="pps">0</span>/ч | Тап: +<span id="pwr">1</span></div>
</div>

<div id="p1" class="page active">
    <div id="coin-container">
        <div id="coin">💻</div>
    </div>
    <p>Уровень: <span id="lvl">1</span></p>
</div>

<div id="p2" class="page">
    <h3>УЛУЧШЕНИЯ</h3>
    <div class="card">
        <div><b>Multitap</b><br><small>Увеличить силу тапа на +1</small></div>
        <button id="buy-pwr" onclick="upgradeClick()">10k</button>
    </div>
    <hr style="border-color: #222;">
    <div class="card">
        <div><b>GPU Miner</b><br><small>+500/час в фоне</small></div>
        <button onclick="buyMine(50000, 500)">50k</button>
    </div>
</div>

<div id="p3" class="page">
    <h3>ЗАДАНИЯ</h3>
    <button onclick="watchAd()" style="width:100%">📺 РЕКЛАМА (<span id="ads">0</span>/10)</button>
</div>

<div class="nav">
    <div class="nav-item active-nav" onclick="tab('p1', this)">TAP</div>
    <div class="nav-item" onclick="tab('p2', this)">UPGRADES</div>
    <div class="nav-item" onclick="tab('p3', this)">EARN</div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    let bal = 0, pps = 0, ads = 0, clickPower = 1;
    let clicksToSync = 0, ppsToSync = 0;

    function init() {
        tg.expand();
        const params = new URLSearchParams(window.location.search);
        bal = parseFloat(params.get('bal')) || 0;
        pps = parseFloat(params.get('pps')) || 0;
        ads = parseInt(params.get('ads')) || 0;
        clickPower = parseInt(params.get('pwr')) || 1; // Получаем силу тапа из базы

        updateUI();
        setInterval(() => { bal += (pps/3600); updateUI(); }, 1000);
        setInterval(() => { autoSave(); }, 10000);
    }
    // ТАП С АНИМАЦИЕЙ
    function tap(event) {
        bal += clickPower;
        clicksToSync += clickPower;
        
        // Создаем вылетающую цифру
        createFloatingText(event);
        updateUI();
    }

    function createFloatingText(event) {
        const container = document.getElementById('coin-container');
        const text = document.createElement('div');
        text.className = 'tap-animation';
        text.innerText = '+' + clickPower;
        
        // Позиция цифры (центр монеты или место клика)
        text.style.left = '50%';
        text.style.top = '20%';
        
        container.appendChild(text);
        setTimeout(() => text.remove(), 600);
    }

    document.getElementById('coin').onclick = (e) => tap(e);

    // Улучшение силы клика
    function upgradeClick() {
        let cost = clickPower * 10000; // Цена растет с каждым уровнем
        if (bal >= cost) {
            bal -= cost;
            clickPower += 1;
            updateUI();
            tg.HapticFeedback.impactOccurred('medium');
        } else {
            tg.showAlert("Нужно " + cost + " $SOM!");
        }
    }

    function buyMine(cost, p) {
        if(bal >= cost) { bal -= cost; pps += p; ppsToSync += p; updateUI(); }
    }

    function watchAd() { if(ads < 10) { ads++; bal += 5000; updateUI(); } }

    function updateUI() {
        document.getElementById('bal').innerText = Math.floor(bal).toLocaleString();
        document.getElementById('pps').innerText = Math.floor(pps);
        document.getElementById('ads').innerText = ads;
        document.getElementById('pwr').innerText = clickPower;
        document.getElementById('buy-pwr').innerText = (clickPower * 10000).toLocaleString();
        document.getElementById('lvl').innerText = bal >= 5000000 ? 3 : (bal >= 1000000 ? 2 : 1);
    }

    function autoSave() {
        if (clicksToSync > 0 || ppsToSync > 0) {
            // Формат: клики : реклама : новый_доход : сила_тапа
            tg.sendData(clicksToSync + ":" + ads + ":" + ppsToSync + ":" + clickPower);
            clicksToSync = 0; ppsToSync = 0;
        }
    }

    function tab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active-nav');
    }
</script>
</body>
</html>
