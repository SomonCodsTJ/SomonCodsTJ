<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Somon Coins TJ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- CSS СТИЛИ (ДИЗАЙН) --- */
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Матричный фон */
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.3;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 20px;
        }

        .stat-box {
            border: 1px solid #0f0;
            padding: 5px 10px;
            background: rgba(0, 20, 0, 0.8);
        }

        /* Вкладки */
        .tab-content {
            display: none; /* Скрываем все вкладки по умолчанию */
            flex-grow: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: flex; /* Показываем активную */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Тапалка */
        .hacker-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #004400 0%, #000000 90%);
            border: 4px solid #0f0;
            box-shadow: 0 0 25px #0f0, inset 0 0 20px #0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            margin-bottom: 30px;
        }

        .hacker-circle:active {
            transform: scale(0.95);
            box-shadow: 0 0 40px #0f0;
        }

        .terminal-text {
            font-size: 24px;
            font-weight: bold;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Всплывающие цифры */
        .float-text {
            position: absolute;
            color: #fff;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        /* Кнопки */
        .hacker-btn {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 5px #0f0;
            width: 80%;
        }

        .hacker-btn:disabled {
            border-color: #555;
            color: #555;
            box-shadow: none;
        }

        /* Нижнее меню */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #0f0;
            padding: 15px 0;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #050;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-btn.active {
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }

        .req { color: #f00; margin: 5px 0; }
        .req.done { color: #0f0; }
        .card { border: 1px solid #0f0; padding: 15px; margin: 10px 0; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="app-container">
        <canvas id="matrix-canvas"></canvas>

        <div class="content">
            <!-- Верхняя панель -->
            <div class="header">
                <div class="stat-box">LVL: <span id="lvl-display">1</span></div>
                <div class="stat-box">💰 <span id="balance-display">0</span></div>
            </div>

            <!-- ВКЛАДКА: ГЛАВНАЯ -->
            <div id="tab-main" class="tab-content active">
                <div class="hacker-circle" id="tap-btn">
                    <div class="terminal-text">TAP_CORE</div>
                </div>
                <div class="energy-bar">
                    ⚡ Energy: <span id="energy-display">1000</span>/1000
                </div>
            </div>

            <!-- ВКЛАДКА: УЛУЧШЕНИЯ -->
            <div id="tab-upgrade" class="tab-content">
                <h2>SYSTEM UPGRADE</h2>
                <div class="card">
                    <p>Повысить уровень доступа</p>
                    <p>Доход: +<span id="next-lvl-income">2</span> за клик</p>
                    <button class="hacker-btn" id="btn-upgrade">UPGRADE (<span id="upgrade-cost">100</span> 💰)</button>
                </div>
            </div>

            <!-- ВКЛАДКА: ДРУЗЬЯ -->
            <div id="tab-friends" class="tab-content">
                <h2>NODES</h2>
                <div class="card">
                    <p>Приглашено: <span id="friends-display">0</span> / 5</p>
                    <button class="hacker-btn" onclick="addFriend()">[TEST] Пригласить друга</button>
                </div>
            </div>

            <!-- ВКЛАДКА: ВЫВОД -->
            <div id="tab-withdraw" class="tab-content">
                <h2>CASH OUT</h2>
                <div class="card" style="text-align: left;">
                    <div id="req-lvl" class="req">[X] Уровень 4+</div>
                    <div id="req-ads" class="req">[X] Реклама 10+ (<span id="ads-display">0</span>)</div>
                    <div id="req-friends" class="req">[X] Друзья 5+</div>
                </div>
                <button class="hacker-btn" onclick="watchAd()">Смотреть рекламу (+1)</button>
                <br>
                <button class="hacker-btn" id="btn-withdraw" disabled>ВЫВЕСТИ СРЕДСТВА</button>
            </div>

            <!-- Нижнее меню -->
            <div class="bottom-nav">
                <button class="nav-btn active" onclick="switchTab('main', this)">TERMINAL</button>
                <button class="nav-btn" onclick="switchTab('upgrade', this)">UPGRADE</button>
                <button class="nav-btn" onclick="switchTab('friends', this)">NODES</button>
                <button class="nav-btn" onclick="switchTab('withdraw', this)">CASH</button>
            </div>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT ЛОГИКА ---
        
        // Данные пользователя
        let balance = 0;
        let level = 1;
        let energy = 1000;
        let adsWatched = 0;
        let friendsCount = 0;

        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.expand(); // На весь экран

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('balance-display').innerText = balance;
            document.getElementById('lvl-display').innerText = level;
            document.getElementById('energy-display').innerText = energy;
            document.getElementById('next-lvl-income').innerText = level + 1;
            
            const cost = level * 100;
            document.getElementById('upgrade-cost').innerText = cost;
            
            const btnUpgrade = document.getElementById('btn-upgrade');
            btnUpgrade.disabled = balance < cost;

            // Обновление требований вывода
            document.getElementById('ads-display').innerText = adsWatched;
            document.getElementById('friends-display').innerText = friendsCount;
            
            updateRequirement('req-lvl', level >= 4);
            updateRequirement('req-ads', adsWatched >= 10);
            updateRequirement('req-friends', friendsCount >= 5);

            const canWithdraw = level >= 4 && adsWatched >= 10 && friendsCount >= 5;
            document.getElementById('btn-withdraw').disabled = !canWithdraw;
        }

        function updateRequirement(id, isDone) {
            const el = document.getElementById(id);
            if (isDone) {
                el.className = 'req done';
                el.innerText = el.innerText.replace('[X]', '[OK]');
            } else {
                el.className = 'req';
                el.innerText = el.innerText.replace('[OK]', '[X]');
            }
        }

        // Логика Тапа
        document.getElementById('tap-btn').addEventListener('click', (e) => {
            if (energy > 0) {
                balance += level;
                energy -= 1;
                
                // Анимация цифры
                const floatText = document.createElement('div');
                floatText.className = 'float-text';
                floatText.innerText = '+' + level;
                floatText.style.left = (e.clientX - 20) + 'px';
                floatText.style.top = (e.clientY - 20) + 'px';
                document.body.appendChild(floatText);
                setTimeout(() => floatText.remove(), 1000);

                updateUI();
            }
        });

        // Логика Апгрейда
        document.getElementById('btn-upgrade').addEventListener('click', () => {
            const cost = level * 100;
            if (balance >= cost) {
                balance -= cost;
                level++;
                updateUI();
            }
        });

        // Тестовые функции
        function addFriend() { friendsCount++; updateUI(); }
        function watchAd() { adsWatched++; updateUI(); }

        // Переключение вкладок
        window.switchTab = function(tabName, btn) {
            // Скрываем все вкладки
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            // Показываем нужную
            document.getElementById('tab-' + tabName).classList.add('active');
            
            // Обновляем кнопки меню
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- МАТРИЧНЫЙ ФОН ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const letters = '010101 SOMON COINS TJ';
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Запуск
        updateUI();
    </script>
</body>
</html>
